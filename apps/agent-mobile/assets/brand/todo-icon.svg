<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="2048" height="2048" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">Zero: three bold graphite tasks on flat white</title>
  <desc id="description">Three enlarged raised-metal task rings and bars on a full-bleed white square; no background shading, rim or shadow.</desc>
  <defs>

    <linearGradient id="rimLight" x1="5%" y1="0" x2="95%" y2="100%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.85" />
    </linearGradient>
    <filter id="metalShadow" x="-12%" y="-30%" width="125%" height="170%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3.2" />
      <feOffset dx="1" dy="5" />
      <feComponentTransfer><feFuncA type="linear" slope="0.29" /></feComponentTransfer>
      <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>

    <linearGradient id="metalSide" x1="0" y1="0" x2="10%" y2="100%">
      <stop offset="0" stop-color="#ababab" />
      <stop offset="0.4" stop-color="#d0d0d0" />
      <stop offset="0.85" stop-color="#676767" />
      <stop offset="1" stop-color="#989898" />
    </linearGradient>
    <linearGradient id="ringBevel" x1="14%" y1="0" x2="86%" y2="100%">
      <stop offset="0" stop-color="#eeeeee" />
      <stop offset="0.18" stop-color="#a9a9a9" />
      <stop offset="0.39" stop-color="#545454" />
      <stop offset="0.55" stop-color="#d6d6d6" />
      <stop offset="0.8" stop-color="#626262" />
      <stop offset="1" stop-color="#414141" />
    </linearGradient>
    <linearGradient id="silverFace" x1="0" y1="14%" x2="100%" y2="78%">
      <stop offset="0" stop-color="#747474" />
      <stop offset="0.18" stop-color="#c8c8c8" />
      <stop offset="0.38" stop-color="#999999" />
      <stop offset="0.69" stop-color="#737373" />
      <stop offset="1" stop-color="#5e5e5e" />
    </linearGradient>
    <linearGradient id="innerBevel" x1="0" y1="0" x2="70%" y2="100%">
      <stop offset="0" stop-color="#565656" />
      <stop offset="0.4" stop-color="#999999" />
      <stop offset="0.65" stop-color="#eeeeee" />
      <stop offset="1" stop-color="#ffffff" />
    </linearGradient>
    <linearGradient id="barBevel" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0" stop-color="#a3a3a3" />
      <stop offset="0.08" stop-color="#ffffff" />
      <stop offset="0.25" stop-color="#dfdfdf" />
      <stop offset="0.62" stop-color="#a4a4a4" />
      <stop offset="0.86" stop-color="#676767" />
      <stop offset="1" stop-color="#d4d4d4" />
    </linearGradient>
    <path id="ringShape" fill-rule="evenodd" d="M68 0a68 68 0 1 1-136 0a68 68 0 1 1 136 0M39 0a39 39 0 1 0-78 0a39 39 0 1 0 78 0" />
    <g id="taskRow" filter="url(#metalShadow)">
      <use xlink:href="#ringShape" transform="translate(0 3)" fill="url(#metalSide)" />
      <use xlink:href="#ringShape" fill="url(#ringBevel)" />
      <circle r="67" fill="none" stroke="url(#rimLight)" stroke-width="1.5" />
      <path fill="url(#silverFace)" fill-rule="evenodd" d="M63 0a63 63 0 1 1-126 0a63 63 0 1 1 126 0M44 0a44 44 0 1 0-88 0a44 44 0 1 0 88 0" />
      <circle r="41.5" fill="none" stroke="url(#innerBevel)" stroke-width="5" />
      <rect x="108" y="-24" width="324" height="54" rx="26" fill="url(#metalSide)" />
      <rect x="108" y="-27" width="324" height="54" rx="26" fill="url(#barBevel)" />
      <rect x="112" y="-22" width="316" height="43" rx="21" fill="url(#silverFace)" />
      <path d="M118-14q3-8 13-8h274q12 0 17 8" fill="none" stroke="#ffffff" stroke-opacity="0.86" stroke-width="1.6" stroke-linecap="round" />
      <path d="M119 20q3 5 14 5h272q11 0 16-5" fill="none" stroke="#f5f5f5" stroke-opacity="0.75" stroke-width="1.2" stroke-linecap="round" />
    </g>
  </defs>
  <g id="background">
    <rect x="0" y="0" width="1024" height="1024" fill="#ffffff" /></g>

  <g id="artwork" transform="translate(512 500) scale(1.25) translate(-512 -500)"><use xlink:href="#taskRow" transform="translate(330 330)" /><use xlink:href="#taskRow" transform="translate(330 500)" /><use xlink:href="#taskRow" transform="translate(330 670)" /></g></svg>