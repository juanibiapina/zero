# Dev flow: tapping a capture in Upcoming opens the same detail editor as Home.
# NOT run by any workflow (ci/ and release/ are the automated folders). Run on
# the attached Pixel with the dev client + Metro:
#
#   maestro --no-ansi test apps/agent-mobile/.maestro/dev/upcoming-detail.yaml
#
# launchApp has no clearState, so it keeps the signed-in session. It creates its
# OWN throwaway capture (never touches existing data), schedules it to tomorrow so
# it lands in Upcoming, verifies the Upcoming tap opens the detail sheet (the
# Schedule + Refine rows are unique to it), then completes the throwaway to clean
# up.
appId: dev.juanibiapina.zeroagent
---
- launchApp
- extendedWaitUntil:
    visible: 'Home'
    timeout: 45000
# Create a throwaway capture (collapsed FAB is labelled "Capture").
- tapOn: '^Capture$'
- inputText: 'ZZZ maestro upcoming editor'
# Submit with the "+" button: its a11y label reuses "Capture" (the fab/pill
# label), so target the last match (pill renders first, submit last).
- tapOn:
    text: '^Capture$'
    index: 1
- assertVisible: 'ZZZ maestro upcoming editor'
# Open its detail and schedule it to tomorrow so it moves to Upcoming.
- tapOn: 'Edit "ZZZ maestro upcoming editor"'
- assertVisible: 'Set schedule'
- tapOn: 'Set schedule'
- tapOn: 'Tomorrow'
# It drops off Home (now future-dated) and the sheet closes. Go to Upcoming.
- tapOn: 'Upcoming'
- extendedWaitUntil:
    visible: 'ZZZ maestro upcoming editor'
    timeout: 15000
# The payload: tapping the text opens the SAME detail editor. Its Schedule and
# Refine rows are unique to that sheet (the old inline edit had neither).
- tapOn: 'Edit "ZZZ maestro upcoming editor"'
- assertVisible: 'Set schedule'
- assertVisible: 'Refine into tasks & projects'
- takeScreenshot: 01-upcoming-detail
# Clean up: the round check completes (processes) the throwaway capture.
- tapOn: 'Complete capture'
- extendedWaitUntil:
    notVisible: 'ZZZ maestro upcoming editor'
    timeout: 15000
- takeScreenshot: 02-cleaned-up
