# Smoke flow: the app must boot to the sign-in screen (not hang on a spinner or
# crash). Runs on an emulator in CI. If Clerk fails to initialise the app hangs
# on a spinner and the wait below times out, catching that regression.
#
# The actual Google OAuth round-trip needs a real browser + Google account and
# cannot be automated on the emulator; it is covered by a separate flow.
appId: dev.juanibiapina.zeroagent
---
- launchApp:
    clearState: true
- takeScreenshot: 00-launch
- extendedWaitUntil:
    visible: "Continue with Google"
    timeout: 45000
- assertVisible: "Sign in with your Zero account."
- takeScreenshot: 01-sign-in
