# Release E2E (hermetic: fake auth + local worker, throwaway DO wiped per run).
# Capture something, assert it lands in the Captures list, process it, assert it
# leaves the open list. No clearState: the run keeps the fake signed-in session.
appId: dev.juanibiapina.zeroagent
---
- launchApp
- extendedWaitUntil:
    visible: "Captures"
    timeout: 45000
- takeScreenshot: capture-00-open
- tapOn: "Capture"
- inputText: "Release E2E capture"
- pressKey: Enter
- assertVisible: "Release E2E capture"
- takeScreenshot: capture-01-added
# Close the quick-add so its full-screen backdrop stops covering the row.
- tapOn: "Dismiss quick add"
- tapOn: 'Process "Release E2E capture"'
- assertNotVisible: "Release E2E capture"
- takeScreenshot: capture-02-processed
