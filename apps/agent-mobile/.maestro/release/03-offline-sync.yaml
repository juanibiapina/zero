# Release E2E (hermetic). Go offline, capture (optimistic local write shows at
# once), go back online, relaunch, assert the capture survived. Exercises the
# op-sqlite offline outbox flushing to the local worker on reconnect. Timing-
# sensitive, so the assertions use generous waits.
appId: dev.juanibiapina.zeroagent
---
- launchApp
- extendedWaitUntil:
    visible: "Captures"
    timeout: 45000
- setAirplaneMode: enabled
- tapOn: "Capture"
- inputText: "Offline E2E capture"
- pressKey: Enter
# Optimistic: the row appears immediately from the local store while offline.
- assertVisible: "Offline E2E capture"
- takeScreenshot: offline-01-local
- tapOn: "Dismiss quick add"
- setAirplaneMode: disabled
# Relaunch to prove the write persisted rather than living only in memory.
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Offline E2E capture"
    timeout: 45000
- takeScreenshot: offline-02-synced
