appId: dev.juanibiapina.zeroagent
---
- openLink: ${METRO_DEEP_LINK}
- extendedWaitUntil:
    visible: Browse
    timeout: 45000
- openLink: zeroagent:///e2e-medicine-proof
- extendedWaitUntil:
    visible: Schedule native proof
    timeout: 45000
- tapOn: Schedule visible reminder proof
- extendedWaitUntil:
    visible: Alarm scheduled .*
    timeout: 30000
- swipe:
    start: 50%, 0%
    end: 50%, 85%
- assertVisible: E2E medicine
- takeScreenshot: medicine-visible-reminder
- pressKey: Back
- takeScreenshot: medicine-status-bar-icon
- tapOn: Open medicine notification settings
- assertVisible: Medicines
- assertVisible: Medicine reminders
- assertVisible: Medicine alarms
- takeScreenshot: medicine-android-categories
- pressKey: Back
- tapOn: Open medicine reminder category
- assertVisible: Medicine reminders
- takeScreenshot: medicine-reminder-category
- pressKey: Back
- tapOn: Take native proof
- assertVisible: Dose taken natively
- tapOn: Clear native proof
- assertVisible: Medicine proof cleared
