appId: dev.juanibiapina.zeroagent
tags:
  - taskdo-proof
---
- launchApp
- extendedWaitUntil:
    visible: "Offline · saved on this device"
    timeout: 45000
- tapOn: "^Task$"
- assertVisible: "New item text"
- inputText: "TaskDO on phone"
- tapOn:
    id: "quick-add-submit"
- extendedWaitUntil:
    visible: "TaskDO on phone"
    timeout: 30000
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "TaskDO on phone"
    timeout: 45000
- tapOn: "TaskDO on phone"
- tapOn:
    id: "task-edit-input"
- eraseText: 60
- inputText: "TaskDO edited on phone"
- pressKey: Back
- pressKey: Back
- extendedWaitUntil:
    visible: "TaskDO edited on phone"
    timeout: 30000
