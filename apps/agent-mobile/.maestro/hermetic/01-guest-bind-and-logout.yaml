# A fresh guest workspace persists, binds to Account A, and is removed locally on logout.
appId: dev.juanibiapina.zeroagent
---
- launchApp
- extendedWaitUntil:
    visible: "Saved on this device"
    timeout: 45000
- assertVisible: "Home"
- tapOn: "^Task$"
- assertVisible: "New item text"
- inputText: "E2E guest task"
- tapOn:
    id: "quick-add-submit"
- extendedWaitUntil:
    visible: "E2E guest task"
    timeout: 30000
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "E2E guest task"
    timeout: 45000
- assertVisible: "Saved on this device"
- tapOn: "Account"
- tapOn: "Sign in"
- tapOn: "Sign in as Account A"
- extendedWaitUntil:
    visible: "Synced"
    timeout: 45000
- assertVisible: "E2E guest task"
- tapOn: "Account"
- tapOn: "Sign out"
- assertVisible: "Sign out and remove this device copy?"
- tapOn: "Remove copy and sign out"
- extendedWaitUntil:
    visible: "Saved on this device"
    timeout: 45000
- assertVisible: "Nothing on your plate yet"
- assertNotVisible: "E2E guest task"
