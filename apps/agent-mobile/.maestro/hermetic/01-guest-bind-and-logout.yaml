# A fresh guest workspace persists, binds to Account A, and is removed locally on logout.
appId: dev.juanibiapina.zeroagent
---
- openLink: ${METRO_DEEP_LINK}
- extendedWaitUntil:
    visible: "Saved on this device"
    timeout: 45000
- assertVisible: "Home"
- tapOn: "^Task$"
- assertVisible: "New item text"
- assertVisible: "No date"
- assertVisible: "No project"
- pressKey: Back
- assertVisible: "^Task$"
- assertNotVisible: "New item text"
- tapOn: "^Task$"
- assertVisible: "New item text"
- inputText: "E2E guest task"
- tapOn:
    id: "quick-add-submit"
- extendedWaitUntil:
    visible: "E2E guest task"
    timeout: 30000
- stopApp
- openLink: ${METRO_DEEP_LINK}
- extendedWaitUntil:
    visible: "E2E guest task"
    timeout: 45000
- assertVisible: "Saved on this device"
- tapOn: "E2E sign in"
- tapOn: "Sign in as Account A"
- extendedWaitUntil:
    visible: "Synced"
    timeout: 45000
- assertNotVisible:
    id: "sync-status-icon-frame"
- assertVisible: "E2E guest task"
- tapOn: "E2E safe sign out"
- extendedWaitUntil:
    visible: "Saved on this device"
    timeout: 45000
- assertVisible: "Home is clear"
- assertVisible: "No projects yet"
- assertNotVisible: "E2E guest task"
