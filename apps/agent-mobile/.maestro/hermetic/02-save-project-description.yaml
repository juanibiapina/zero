# Hermetic E2E: Project description persists and Project completion feedback stays usable.
appId: dev.juanibiapina.zeroagent
---
- launchApp
- extendedWaitUntil:
    visible: "Home"
    timeout: 45000
- extendedWaitUntil:
    visible: "Projects"
    timeout: 45000
- tapOn: "Projects"
- extendedWaitUntil:
    visible: "No projects yet. Name your first outcome."
    timeout: 30000
- tapOn: "Add"
- tapOn: "Name an outcome"
- inputText: "E2E described project"
- pressKey: Enter
- extendedWaitUntil:
    visible: "E2E described project"
    timeout: 30000
- tapOn: "Project description"
- inputText: "E2E durable project description"
- tapOn: "Back to projects"
- extendedWaitUntil:
    visible: "E2E described project"
    timeout: 30000
- tapOn: "E2E described project"
- extendedWaitUntil:
    visible: "E2E durable project description"
    timeout: 30000

# A completed Project task has one compact, icon-bearing snackbar.
- tapOn: "Add"
- assertVisible: "New item text"
- inputText: "E2E snackbar project task"
- tapOn:
    id: "quick-add-submit"
- extendedWaitUntil:
    visible: "E2E snackbar project task"
    timeout: 30000
- tapOn: 'Complete "E2E snackbar project task"'
- assertVisible: "Undo"
# The elevated overlay's uiautomator bounds miss its visual buttons; tap their
# on-screen positions, as in the existing project-toast device flow.
- tapOn:
    point: "71%,75%"
- extendedWaitUntil:
    visible: "E2E snackbar project task"
    timeout: 30000
- tapOn: 'Complete "E2E snackbar project task"'
- assertVisible: "Waiting…"
- assertVisible: ".*📁 E2E described project.*"
- takeScreenshot: compact-project-snackbar
- tapOn:
    point: "85%,75%"
- assertVisible: "Waiting on"
- tapOn: "What needs to happen?"
- inputText: "E2E waiting item"
- tapOn:
    id: "quick-add-submit"
- extendedWaitUntil:
    visible: "E2E waiting item"
    timeout: 30000
- tapOn: "Resolve condition: E2E waiting item"
- extendedWaitUntil:
    notVisible: "E2E waiting item"
    timeout: 30000
