# A native medicine reminder appears in the shade, stays there while the app
# opens and closes its reminders, and Taken from the notification is recorded
# as a dose.
appId: dev.juanibiapina.zeroagent
---
- openLink: ${METRO_DEEP_LINK}
- extendedWaitUntil:
    visible: Browse
    timeout: 45000
- openLink: zeroagent:///e2e-medicine-proof
- extendedWaitUntil:
    visible: Schedule visible reminder proof
    timeout: 45000
- tapOn: Schedule visible reminder proof
- extendedWaitUntil:
    visible: Notifications scheduled .*
    timeout: 30000
- swipe:
    start: 50%, 0%
    end: 50%, 85%
- extendedWaitUntil:
    visible: E2E medicine.*
    timeout: 90000
- pressKey: Back
- tapOn: Import medicine receipts
- extendedWaitUntil:
    visible: "Persisted taken doses: 0.*"
    timeout: 15000
- swipe:
    start: 50%, 0%
    end: 50%, 85%
- extendedWaitUntil:
    visible: E2E medicine.*
    timeout: 15000
- runFlow:
    when:
      notVisible: Taken
    commands:
      - tapOn:
          id: android:id/expand_button
          above: E2E medicine.*
- tapOn: Taken
- pressKey: Back
- tapOn: Import medicine receipts
- assertVisible: "Persisted taken doses: 1.*"
- tapOn: Clear native proof
- assertVisible: Medicine proof cleared
