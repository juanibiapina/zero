# A guest task survives a restart, uploads to Account A, locks on auth loss, and
# gives way to Account B's server task without leaking into Account B.
appId: dev.juanibiapina.zeroagent
---
- openLink: ${METRO_DEEP_LINK}
- extendedWaitUntil:
    visible: "E2E sync: Saved on this device"
    timeout: 45000
- tapOn: "^Add$"
- inputText: "E2E guest task"
- tapOn:
    id: "quick-add-submit"
- extendedWaitUntil:
    visible: "E2E guest task"
    timeout: 30000
- stopApp
- openLink: ${METRO_DEEP_LINK}
- extendedWaitUntil:
    visible: "E2E guest task"
    timeout: 45000
- tapOn: "E2E sign in"
- tapOn: "Sign in as Account A"
- extendedWaitUntil:
    visible: "E2E sync: Synced"
    timeout: 45000
- assertVisible: "E2E guest task"
- tapOn: "E2E simulate auth loss"
- extendedWaitUntil:
    visible: "Tasks locked"
    timeout: 30000
- assertNotVisible: "E2E guest task"
- tapOn: "Sign in"
- tapOn: "Sign in as Account B"
- extendedWaitUntil:
    visible: "These tasks belong to another account"
    timeout: 30000
- assertNotVisible: "E2E guest task"
- tapOn: "Delete local copy"
- tapOn: "Delete copy and continue"
- extendedWaitUntil:
    visible: "E2E server task"
    timeout: 45000
- assertVisible: "E2E sync: Synced"
- assertNotVisible: "E2E guest task"
