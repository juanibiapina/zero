# Deterministic reproduction of the native OAuth redirect handling, without
# Google. Taps the E2E-only "Run redirect probe" button, which opens a Custom
# Tab that redirects to the same zeroagent://sso-callback deep link Clerk uses.
#
# expo-web-browser captures the redirect (logged as probe=success), but Android
# also delivers it to expo-router as a deep link. The app must recover to a
# valid screen afterwards. Without an sso-callback route it lands on a dead
# route and does not return to the sign-in screen, which this flow catches.
appId: dev.juanibiapina.zeroagent
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Saved on this device"
    timeout: 45000
- tapOn: "Account"
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "Run redirect probe"
    timeout: 45000
- tapOn: "Run redirect probe"
# After the redirect deep link, the app must return to the sign-in screen (it is
# not actually signed in during the probe), proving the callback is handled
# gracefully rather than dropping the user on a dead route.
- extendedWaitUntil:
    visible: "Sign in with your Zero account."
    timeout: 30000
- takeScreenshot: probe-recovered
