version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: "Europe/Berlin"
    ignore:
      # The Expo SDK pins these as one set; upgrade them together with
      # `npx expo install --fix` in apps/agent-mobile. React moves with the SDK,
      # and the web apps follow it in lockstep.
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "jest-expo"
      - dependency-name: "eslint-config-expo"
      - dependency-name: "babel-preset-expo"
      # Declared only so the EAS local build resolves it; it must match the
      # Babel 7 that babel-preset-expo runs.
      - dependency-name: "@babel/plugin-transform-react-jsx"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native/*"
      - dependency-name: "@react-native-async-storage/*"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "@types/react"
      - dependency-name: "@types/react-dom"
      # The mobile app stays on ESLint 9 until eslint-plugin-react and
      # eslint-plugin-import (through eslint-config-expo) support ESLint 10:
      # jsx-eslint/eslint-plugin-react#3977, import-js/eslint-plugin-import#3278.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 drops the compiler API that typescript-eslint needs:
      # typescript-eslint/typescript-eslint#10940. astro check also needs 7.1.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      # @cloudflare/vite-plugin requires a matching wrangler, so these move
      # together.
      cloudflare:
        patterns: ["wrangler", "@cloudflare/*"]
      # The TaskDO replica depends on TanStack DB behavior; review these alone.
      tanstack:
        patterns: ["@tanstack/*"]
      # Dependabot puts a package in the most specific matching group, and
      # update-types counts as more specific than patterns alone, so the two
      # groups above must be excluded here explicitly.
      minor-and-patch:
        update-types: [minor, patch]
        exclude-patterns: ["wrangler", "@cloudflare/*", "@tanstack/*"]
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: "Europe/Berlin"
