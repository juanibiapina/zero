name: Release todo CLI

on:
  push:
    tags:
      - 'todo-cli-v*'

permissions:
  contents: write

jobs:
  release:
    name: Release zero-todo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the tag matches the package version
        working-directory: packages/todo-cli
        run: |
          pkg=$(node -p "require('./package.json').version")
          [ "$pkg" = "${GITHUB_REF_NAME#todo-cli-v}" ] \
            || { echo "tag $GITHUB_REF_NAME != package version $pkg"; exit 1; }

      - name: Build
        run: pnpm --filter @zero/todo-cli run build

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" packages/todo-cli/dist/zero-todo.mjs \
            --title "zero-todo ${GITHUB_REF_NAME#todo-cli-v}" \
            --notes-from-tag \
            --latest=false
