name: Mobile native tests

on:
  push:
    paths:
      - 'apps/agent-mobile/modules/**'
      - 'apps/agent-mobile/plugins/**'
      - 'apps/agent-mobile/package.json'
      - 'packages/agent-core/src/medicines/**'
      - '.github/workflows/mobile-native.yml'
  pull_request:
    paths:
      - 'apps/agent-mobile/modules/**'
      - 'apps/agent-mobile/plugins/**'
      - 'apps/agent-mobile/package.json'
      - 'packages/agent-core/src/medicines/**'
      - '.github/workflows/mobile-native.yml'
  workflow_dispatch:

jobs:
  medicine-reminders:
    name: Medicine reminder Kotlin tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore Gradle cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('pnpm-lock.yaml', 'apps/agent-mobile/modules/*/android/build.gradle') }}
          restore-keys: gradle-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prebuild Android project
        working-directory: apps/agent-mobile
        run: npx expo prebuild -p android --no-install

      - name: Run Kotlin tests
        working-directory: apps/agent-mobile/android
        run: ./gradlew :medicine-reminders:testDebugUnitTest --no-daemon

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: medicine-reminders-test-reports
          path: apps/agent-mobile/modules/medicine-reminders/android/build/reports/tests
          if-no-files-found: ignore
