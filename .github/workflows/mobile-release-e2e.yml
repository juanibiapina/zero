name: Mobile Release E2E

# Hermetic signed-in E2E suite. Builds a fake-auth APK (no Google, no Clerk
# network) and drives it on an emulator against a runner-local worker whose
# ENVIRONMENT=test bypass trusts the fake bearer and stores in a throwaway local
# Durable Object. No production data and no second Google account. Manual only,
# never wired into push/PR. Every run uploads logcat + screenshots.
on:
  workflow_dispatch:

env:
  # Clerk publishable key is public and still required at bundle time (the root
  # layout throws without it), even though the fake auth never uses it.
  EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmsuemVyby5qdWFuaWJpYXBpbmEuZGV2JA
  # Swap Clerk for the in-repo fake and point the app at the local worker.
  EXPO_PUBLIC_E2E_FAKE_AUTH: '1'
  EXPO_PUBLIC_API_URL: http://localhost:8787
  MAESTRO_CLI_NO_ANALYTICS: '1'

jobs:
  build:
    name: Build fake-auth APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          android: false
          tool-cache: false
          large-packages: true
          dotnet: true
          haskell: true
          swap-storage: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Reuse a previously built APK when the app sources and fake-auth wiring are
      # unchanged, so iterating on the flow/harness skips the ~24 min rebuild.
      - name: Restore APK cache
        id: apk-cache
        uses: actions/cache@v6
        with:
          path: apps/agent-mobile/apk-out/app-release.apk
          key: apk-e2e-${{ hashFiles('apps/agent-mobile/src/**', 'apps/agent-mobile/modules/**', 'apps/agent-mobile/plugins/**', 'apps/agent-mobile/app.json', 'apps/agent-mobile/app.config.js', 'apps/agent-mobile/metro.config.js', 'apps/agent-mobile/package.json', 'pnpm-lock.yaml', '.github/workflows/mobile-release-e2e.yml') }}

      - name: Install dependencies
        if: steps.apk-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Prebuild Android project
        if: steps.apk-cache.outputs.cache-hit != 'true'
        working-directory: apps/agent-mobile
        run: npx expo prebuild -p android --no-install

      - name: Build release APK (x86_64, debug-signed)
        if: steps.apk-cache.outputs.cache-hit != 'true'
        working-directory: apps/agent-mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon

      - name: Stage APK
        if: steps.apk-cache.outputs.cache-hit != 'true'
        run: |
          APK=$(find apps/agent-mobile/android/app/build/outputs/apk/release -name '*.apk' | head -1)
          mkdir -p apps/agent-mobile/apk-out
          cp "$APK" apps/agent-mobile/apk-out/app-release.apk
          echo "Staged: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: app-release-e2e-apk
          path: apps/agent-mobile/apk-out/app-release.apk
          retention-days: 1

  e2e:
    name: Release E2E (Android emulator)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      # Installing the monorepo deps plus the emulator's 7.3 GB userdata partition
      # overflows the runner disk ("Not enough space to create userdata
      # partition"). Reclaim space before both.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          android: false
          tool-cache: false
          large-packages: true
          dotnet: true
          haskell: true
          swap-storage: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download APK
        uses: actions/download-artifact@v8
        with:
          name: app-release-e2e-apk
          path: ${{ runner.temp }}/apk

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Start local worker
        working-directory: apps/agent-api
        run: |
          mkdir -p "${RUNNER_TEMP}/persist"
          # Background it so it survives into the emulator step (same runner VM).
          # wrangler.e2e.jsonc has no remote AI binding, so no Cloudflare token is
          # needed and the whole stack stays local.
          nohup pnpm exec wrangler dev --config wrangler.e2e.jsonc \
            --persist-to "${RUNNER_TEMP}/persist" --ip 0.0.0.0 --port 8787 \
            > "${RUNNER_TEMP}/worker.log" 2>&1 &
          echo "Waiting for the worker to answer with 401 on /api/tasks ..."
          for _ in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8787/api/tasks || true)
            [ "$code" = "401" ] && break
            sleep 5
          done
          if [ "$code" != "401" ]; then
            echo "Worker did not come up (last: ${code:-none})"; cat "${RUNNER_TEMP}/worker.log"; exit 1
          fi
          echo "Worker up."

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run release suite on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          disable-spellchecker: true
          script: bash apps/agent-mobile/.maestro/run-release-emulator.sh

      - name: Collect artifacts
        if: always()
        run: |
          DEST="${RUNNER_TEMP}/artifacts"
          mkdir -p "$DEST"
          cp "${RUNNER_TEMP}/worker.log" "$DEST/" 2>/dev/null || true
          cp "${RUNNER_TEMP}/logcat.txt" "$DEST/" 2>/dev/null || true
          cp "${RUNNER_TEMP}/screen.png" "$DEST/" 2>/dev/null || true
          cp "${RUNNER_TEMP}/ui.xml" "$DEST/" 2>/dev/null || true
          cp -r "${RUNNER_TEMP}/maestro" "$DEST/maestro" 2>/dev/null || true
          ls -R "$DEST" || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-release-e2e-artifacts
          path: ${{ runner.temp }}/artifacts
          if-no-files-found: warn
