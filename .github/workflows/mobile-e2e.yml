name: Mobile E2E

# Builds a self-contained Android APK and drives it on an emulator with Maestro.
# Split into two jobs so the emulator/flow work can be re-run without the slow
# native rebuild (re-run just the `e2e` job to iterate on flows). Manual only.
# Every run uploads logcat + screenshots so failures are reproducible without a
# physical device.
on:
  workflow_dispatch:
  # Temporary: run on pushes to the harness branch while iterating. Remove
  # before merging.
  push:
    branches: [ mobile-e2e ]

env:
  # Clerk publishable keys are public by design (already shipped in the web
  # bundle and eas.json). Needed at bundle time so Clerk initialises.
  EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmsuemVyby5qdWFuaWJpYXBpbmEuZGV2JA
  MAESTRO_CLI_NO_ANALYTICS: '1'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          android: false
          tool-cache: false
          large-packages: true
          dotnet: true
          haskell: true
          swap-storage: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Reuse a previously built APK when the app sources are unchanged, so
      # iterating on the flow/harness does not pay the ~24 min native rebuild.
      - name: Restore APK cache
        id: apk-cache
        uses: actions/cache@v4
        with:
          path: apps/mobile/apk-out/app-release.apk
          key: apk-${{ hashFiles('apps/mobile/src/**', 'apps/mobile/app.json', 'apps/mobile/package.json', 'pnpm-lock.yaml') }}

      - name: Install dependencies
        if: steps.apk-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Prebuild Android project
        if: steps.apk-cache.outputs.cache-hit != 'true'
        working-directory: apps/mobile
        run: npx expo prebuild -p android --no-install

      - name: Build release APK (x86_64, debug-signed)
        if: steps.apk-cache.outputs.cache-hit != 'true'
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon

      - name: Stage APK
        if: steps.apk-cache.outputs.cache-hit != 'true'
        run: |
          APK=$(find apps/mobile/android/app/build/outputs/apk/release -name '*.apk' | head -1)
          mkdir -p apps/mobile/apk-out
          cp "$APK" apps/mobile/apk-out/app-release.apk
          echo "Staged: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: apps/mobile/apk-out/app-release.apk
          retention-days: 1

  e2e:
    name: E2E (Android emulator)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: app-release-apk
          path: ${{ runner.temp }}/apk

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run E2E on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          # ATD (Automated Test Device) images are stripped down for CI: far less
          # background activity, so SystemUI does not ANR and mask the app.
          target: aosp_atd
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          disable-spellchecker: true
          script: bash apps/mobile/.maestro/run-e2e.sh

      - name: Collect artifacts
        if: always()
        run: |
          DEST="${RUNNER_TEMP}/artifacts"
          mkdir -p "$DEST"
          cp "${RUNNER_TEMP}/logcat.txt" "$DEST/" 2>/dev/null || true
          cp "${RUNNER_TEMP}/screen.png" "$DEST/" 2>/dev/null || true
          cp "${RUNNER_TEMP}/ui.xml" "$DEST/" 2>/dev/null || true
          cp -r "${RUNNER_TEMP}/maestro" "$DEST/maestro" 2>/dev/null || true
          cp -r "$HOME/.maestro/tests" "$DEST/maestro-tests" 2>/dev/null || true
          ls -R "$DEST" || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-e2e-artifacts
          path: ${{ runner.temp }}/artifacts
          if-no-files-found: warn
