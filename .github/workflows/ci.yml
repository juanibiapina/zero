name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint

      - name: Run TypeScript check
        run: pnpm run typecheck

  build:
    name: Build & Validate
    runs-on: ubuntu-latest
    # No credential of any kind. The two build-time values below are public and
    # only decide what a bundle embeds, which this job does not deploy.
    # Production values live on the Workers Builds connectors; bin/check-build-vars
    # compares them against ZeroVault.
    env:
      VITE_CLERK_PUBLISHABLE_KEY: pk_test_ci
      VITE_TELEGRAM_BOT_USERNAME: ci-bot
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm run build

      - name: Run tests
        run: pnpm run test

      - name: Run Workers runtime tests
        run: pnpm --filter @zero/api run test:workers

      # The `--` is required: `turbo run deploy --dry-run` is turbo's own dry
      # run and would execute nothing.
      - name: Deploy dry run
        run: pnpm exec turbo run deploy -- --dry-run

  mobile-native-changes:
    name: Detect native notification changes
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.diff.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the changed paths
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BASE" "$HEAD_SHA" -- \
            apps/agent-mobile/modules apps/agent-mobile/plugins apps/agent-mobile/package.json \
            packages/agent-core/src/notifications packages/agent-core/src/medicines \
            pnpm-lock.yaml .github/workflows/ci.yml; then
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          fi

  mobile-native:
    name: Mobile native Kotlin tests
    runs-on: ubuntu-latest
    needs: mobile-native-changes
    if: needs.mobile-native-changes.outputs.relevant == 'true'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore Gradle cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('pnpm-lock.yaml', 'apps/agent-mobile/modules/*/android/build.gradle') }}
          restore-keys: gradle-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prebuild Android project
        working-directory: apps/agent-mobile
        run: npx expo prebuild -p android --no-install

      - name: Run Kotlin tests
        working-directory: apps/agent-mobile/android
        run: ./gradlew :zero-notifications:testDebugUnitTest --no-daemon

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: zero-notifications-test-reports
          path: apps/agent-mobile/modules/zero-notifications/android/build/reports/tests
          if-no-files-found: ignore

  mobile-update-changes:
    name: Detect mobile update changes
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      relevant: ${{ steps.diff.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the pushed commits
        id: diff
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if git diff --quiet "$BEFORE" "$AFTER" -- \
            apps/agent-mobile packages/agent-core packages/recurrence \
            pnpm-lock.yaml pnpm-workspace.yaml package.json patches; then
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          fi

  mobile-update:
    name: Publish Android preview update
    runs-on: ubuntu-latest
    needs: [mobile-update-changes, lint-and-typecheck, build, mobile-native]
    if: >-
      !cancelled()
      && needs.mobile-update-changes.outputs.relevant == 'true'
      && needs.lint-and-typecheck.result == 'success'
      && needs.build.result == 'success'
      && (needs.mobile-native.result == 'success' || needs.mobile-native.result == 'skipped')
    concurrency:
      group: mobile-update-preview
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish Android preview update
        working-directory: apps/agent-mobile
        run: |
          SUBJECT=$(git log -1 --pretty=%s)
          SHORT_SHA=$(git rev-parse --short HEAD)
          eas update \
            --channel preview \
            --platform android \
            --environment preview \
            --message "$SUBJECT ($SHORT_SHA)" \
            --non-interactive

  mobile-build:
    name: Mobile EAS Build (Android preview)
    runs-on: ubuntu-latest
    # Manual only: EAS free tier includes 15 Android cloud builds, so this never runs on push/PR.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android preview APK
        working-directory: apps/agent-mobile
        run: eas build -p android --profile preview --non-interactive
