name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint

      - name: Run TypeScript check
        run: pnpm run typecheck

  build:
    name: Build & Validate
    runs-on: ubuntu-latest
    # No credential of any kind. The two build-time values below are public and
    # only decide what a bundle embeds, which this job does not deploy.
    # Production values live on the Workers Builds connectors; bin/check-build-vars
    # compares them against ZeroVault.
    env:
      VITE_CLERK_PUBLISHABLE_KEY: pk_test_ci
      VITE_TELEGRAM_BOT_USERNAME: ci-bot
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm run build

      - name: Run tests
        run: pnpm run test

      # The `--` is required: `turbo run deploy --dry-run` is turbo's own dry
      # run and would execute nothing.
      - name: Deploy dry run
        run: pnpm exec turbo run deploy -- --dry-run

  mobile-update-changes:
    name: Detect mobile update changes
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      relevant: ${{ steps.diff.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the pushed commits
        id: diff
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if git diff --quiet "$BEFORE" "$AFTER" -- \
            apps/agent-mobile packages/agent-core \
            pnpm-lock.yaml pnpm-workspace.yaml package.json patches; then
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          fi

  mobile-update:
    name: Publish Android preview update
    runs-on: ubuntu-latest
    needs: [mobile-update-changes, lint-and-typecheck, build]
    if: needs.mobile-update-changes.outputs.relevant == 'true'
    concurrency:
      group: mobile-update-preview
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish Android preview update
        working-directory: apps/agent-mobile
        run: |
          SUBJECT=$(git log -1 --pretty=%s)
          SHORT_SHA=$(git rev-parse --short HEAD)
          eas update \
            --channel preview \
            --platform android \
            --environment preview \
            --message "$SUBJECT ($SHORT_SHA)" \
            --non-interactive

  mobile-build:
    name: Mobile EAS Build (Android preview)
    runs-on: ubuntu-latest
    # Manual only: EAS free tier includes 15 Android cloud builds, so this never runs on push/PR.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android preview APK
        working-directory: apps/agent-mobile
        run: eas build -p android --profile preview --non-interactive
